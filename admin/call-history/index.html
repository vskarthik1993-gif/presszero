<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0B0B0D" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
  <title>Call History — PressZero Admin</title>
  <meta name="description" content="Automate the top and middle funnels. Let humans close the bottom funnel." />
  <meta name="application-name" content="PressZero" />
  <meta name="apple-mobile-web-app-title" content="PressZero" />
  <link rel="canonical" href="https://presszero.in/admin/call-history/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PressZero" />
  <meta property="og:title" content="PressZero - Voice AI, Humanised" />
  <meta property="og:description" content="Automate the top and middle funnels. Let humans close the bottom funnel." />
  <meta property="og:url" content="https://presszero.in/admin/call-history/" />
  <meta property="og:image" content="https://presszero.in/assets/presszero-share-whatsapp-v2.jpg" />
  <meta property="og:image:secure_url" content="https://presszero.in/assets/presszero-share-whatsapp-v2.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="PressZero voice AI symbol" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="PressZero - Voice AI, Humanised" />
  <meta name="twitter:description" content="Automate the top and middle funnels. Let humans close the bottom funnel." />
  <meta name="twitter:image" content="https://presszero.in/assets/presszero-share-whatsapp-v2.jpg" />
  <meta name="twitter:image:alt" content="PressZero voice AI symbol" />
  <link rel="icon" href="/assets/favicon-512.png" type="image/png" sizes="512x512" />
  <link rel="icon" href="/assets/favicon-android-1024.png" type="image/png" sizes="1024x1024" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-rail" id="admin-rail"></aside>
    <main class="admin-main">
      <header class="page-header">
        <div>
          <p class="eyebrow">Conversation Archive</p>
          <h1>Call History</h1>
          <p class="lede">Saved transcripts, quotes, payment links, and recordings from Leela voice tests.</p>
        </div>
        <label class="history-filter">
          <input type="checkbox" id="hide-short" checked />
          Hide under 30s
        </label>
      </header>
      <section class="history-layout">
        <aside class="history-list panel">
          <div class="panel-head">
            <h3>Saved Calls</h3>
            <span id="list-meta">Loading</span>
          </div>
          <div id="call-list"></div>
          <div class="history-load-more-wrap" id="load-more-wrap" hidden>
            <button type="button" class="history-load-more" id="load-more">Load more</button>
          </div>
        </aside>
        <section class="history-detail" id="call-detail">
          <div class="panel empty-state">Select a saved call to review.</div>
        </section>
      </section>
    </main>
  </div>
  <script src="/admin/admin.js"></script>
  <script src="/admin/call-history/history.js"></script>
</body>
</html>
